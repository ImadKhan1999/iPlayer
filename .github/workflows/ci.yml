name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDirectDebugUnitTest 2>&1 | tee build.log
      - name: Build debug APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDirectDebug assemblePlayDebug 2>&1 | tee -a build.log
      - name: Compiler errors summary
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | grep -v "^\s*at " | head -300 || true
      - name: Lint
        run: ./gradlew --no-daemon lintDirectDebug
        continue-on-error: true
      - name: Test and lint summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for x in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              r = ET.parse(x).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0)); e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          print(f"Unit tests: {t} run, {f} failed, {e} errors, {s} skipped")
          for x in glob.glob("app/build/reports/lint-results*.xml"):
              issues = ET.parse(x).getroot().findall("issue")
              bad = [i for i in issues if i.get("severity") in ("Error", "Fatal")]
              print(f"Lint: {len(issues)} issues, {len(bad)} errors")
              for i in bad[:60]:
                  loc = i.find("location")
                  print(f"  {i.get('id')}: {i.get('message')} ({loc.get('file','').split('/app/')[-1] if loc is not None else ''}:{loc.get('line','') if loc is not None else ''})")
          PY
      - name: Checksums
        run: |
          cd app/build/outputs/apk
          find . -name '*.apk' -exec sha256sum {} \; | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iplayer-debug-apks
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/SHA256SUMS.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
