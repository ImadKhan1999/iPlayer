name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDirectDebugUnitTest 2>&1 | tee build.log
      - name: Build debug APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDirectDebug assemblePlayDebug 2>&1 | tee -a build.log
      - name: Compiler errors summary
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | grep -v "^\s*at " | head -300 || true
      - name: Lint
        run: ./gradlew --no-daemon lintDirectDebug
        continue-on-error: true
      - name: Checksums
        run: |
          cd app/build/outputs/apk
          find . -name '*.apk' -exec sha256sum {} \; | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iplayer-debug-apks
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/SHA256SUMS.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
